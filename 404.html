<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rak kosong — BANGKAH.TECH</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#101010; --paper:#f2ede1; --yellow:#ffd93d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink);
    font-family:ui-monospace,"Courier New",monospace;
    background-image:linear-gradient(rgba(16,16,16,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(16,16,16,.055) 1px,transparent 1px);
    background-size:28px 28px; }
  .box { border:3px solid var(--ink); background:#fffdf7; box-shadow:8px 8px 0 var(--ink); padding:32px; max-width:520px; }
  h1 { margin:0 0 10px; font-family:"Arial Black",Impact,sans-serif; font-size:clamp(36px,9vw,64px); line-height:.95; text-transform:uppercase; }
  p { margin:0 0 18px; font-size:14px; }
  a { display:inline-block; border:3px solid var(--ink); background:var(--yellow); color:var(--ink); padding:10px 14px; text-decoration:none; font-weight:700; box-shadow:4px 4px 0 var(--ink); text-transform:uppercase; letter-spacing:.08em; font-size:12px; }
  .code { display:inline-block; border:2px solid var(--ink); padding:2px 8px; font-size:11px; font-weight:700; margin-bottom:14px; letter-spacing:.12em; }
</style>
</head>
<body>
  <div class="box">
    <span class="code">404 · RAK TIDAK ADA</span>
    <h1>Rak kosong</h1>
    <p>Barang yang kamu cari tidak ada di gudang ini. Mungkin sudah dipindah, mungkin memang belum diproduksi.</p>
    <a href="/">Kembali ke gudang →</a>
  </div>
</body>
</html>
